<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC0000"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </linearGradient>
    <filter id="pulse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="64" cy="64" r="10" fill="white" filter="url(#pulse)"/>
  <text x="64" y="88" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="32" fill="white" letter-spacing="4">LIVE</text>
</svg>
